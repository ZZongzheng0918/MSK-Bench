DEP:
  bias_rate: 0.002
  buffer_size: 200
  intervention_length: 5
  intervention_proba: 0.001
  kappa: 1169.7
  normalization: independent
  q_norm_selector: l2
  regularization: 32
  s4avg: 2
  sensor_delay: 1
  tau: 40
  test_episode_every: 5
  time_dist: 5
  with_learning: true

env_args: {}

mpo_args:
  hidden_size: 1024
  lr_actor: 5.0e-05
  lr_critic: 8.0e-05
  lr_dual: 0.002

tonic:
  after_training: ''
  
  agent: deprl.custom_agents.dep_factory(3, deprl.custom_mpo_torch.TunedMPO())(replay=deprl.replays.buffers.Buffer(return_steps=3,
    batch_size=256, steps_between_batches=1000, batch_iterations=30, steps_before_batches=1e5))
  
  before_training: ''
  checkpoint: last
  
  # 🔥 Environment ID
  environment: deprl.environments.Gym('MyoHurdle-v0', scaled_actions=False, reset_type='random')
  
  environment_name: deprl_hurdle_v0
  full_save: 0
  
  # 🔥 Header
  # 请确保 myo_hurdle_env.py 在当前目录下
  header: import sys, os; sys.path.append(os.getcwd()); import deprl, myosuite; 
  
  name: MyoHurdle_Run
  parallel: 50
  resume: 0
  seed: 42
  sequential: 10
  test_environment: null
  
  trainer: deprl.custom_trainer.Trainer(steps=int(2e8), epoch_steps=int(2e5), save_steps=int(2e6))

working_dir: ./baselines_Hurdle