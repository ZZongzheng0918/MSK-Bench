DEP:
  bias_rate: 0.002
  buffer_size: 200
  intervention_length: 5
  intervention_proba: 0.001
  kappa: 1169.7
  normalization: independent
  q_norm_selector: l2
  regularization: 32
  s4avg: 2
  sensor_delay: 1
  tau: 40
  test_episode_every: 5
  time_dist: 5
  with_learning: true

env_args: {}

mpo_args:
  hidden_size: 1024
  # 🔥 [优化] 抱包裹任务更精细，学习率稍微调小一点，防止发散
  lr_actor: 3.0e-05
  lr_critic: 6.0e-05
  lr_dual: 0.002

tonic:
  after_training: ''
  
  # Replay Buffer 设置保持默认，这套参数对于 MyoSuite 比较鲁棒
  agent: deprl.custom_agents.dep_factory(3, deprl.custom_mpo_torch.TunedMPO())(replay=deprl.replays.buffers.Buffer(return_steps=3,
    batch_size=256, steps_between_batches=1000, batch_iterations=30, steps_before_batches=1e5))
  
  before_training: ''
  checkpoint: last
  
  # 🔥 [关键] 指向注册好的 Gym ID
  # 之前我们通过 register_env_with_variants 注册了 "MyoPackageDelivery-v0"
  # 注意：scaled_actions=False 是必须的，因为 DEP 会自己处理动作缩放
  environment: deprl.environments.Gym('MyoPackageDelivery-v0', scaled_actions=False, reset_type='init')
  
  environment_name: deprl_package_delivery_v0
  full_save: 0
  
  # Header 导入必要的包，确保环境注册代码能被执行到
  # 如果你的注册代码在 myosuite/__init__.py 或其他地方，确保这里 import 了
  header: import deprl, myosuite
  
  name: myoPackageDelivery_run
  parallel: 100
  resume: 0
  seed: 0
  sequential: 10
  test_environment: null
  
  # 训练步数设为 1e8 (1亿步)，epoch设为 2e5
  trainer: deprl.custom_trainer.Trainer(steps=int(1e8), epoch_steps=int(2e5), save_steps=int(2e6))

working_dir: ./baselines_PackageDelivery