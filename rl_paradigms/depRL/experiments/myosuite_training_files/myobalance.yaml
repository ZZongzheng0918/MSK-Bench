DEP:
  bias_rate: 0.002
  buffer_size: 200
  intervention_length: 5
  intervention_proba: 0.0004
  kappa: 1169.7
  normalization: independent
  q_norm_selector: l2
  regularization: 16
  s4avg: 2
  sensor_delay: 1
  tau: 40
  test_episode_every: 3
  time_dist: 5
  with_learning: true

env_args: {}

mpo_args:
  # 平衡任务通常需要较大的网络容量来拟合复杂的动态
  hidden_size: 2048
  # 稍微降低 Actor 的学习率，以获得更平滑的策略更新，防止在平衡板上剧烈抖动
  lr_actor: 2.0e-05
  lr_critic: 6.081e-05
  lr_dual: 0.00213

tonic:
  after_training: ''
  # 使用 DEP 工厂创建代理，保持与之前一致的重放缓冲区配置
  # steps_before_batches 保持 2e5 以确保有足够的探索数据
  agent: deprl.custom_agents.dep_factory(3, deprl.custom_mpo_torch.TunedMPO())(replay=deprl.replays.buffers.Buffer(return_steps=3,
    batch_size=256, steps_between_batches=1000, batch_iterations=30, steps_before_batches=2e5))
  before_training: ''
  checkpoint: last
  
  # 🟢 [关键修改] 指向新的平衡环境
  # 注意：reset_type='init' 确保每次都从板子中心开始，这对平衡任务至关重要
  environment: deprl.environments.Gym('myoLegBalance-v0', scaled_actions=False, reset_type='init')
  
  environment_name: myo_balance_baseline
  full_save: 0
  
  # 确保引入了您的自定义环境注册代码
  # 假设您已经在 myosuite/envs/myo/__init__.py 中注册了 myoLegBalance-v0
  # 如果是在单独脚本中注册，这里可能需要改为 import your_script
  header: import deprl, myosuite; from myosuite.utils import gym
  
  name: myoBalance_v1
  
  # 增加并行环境数量以加快收集数据的速度，平衡任务通常样本效率较低
  parallel: 120 
  resume: 0
  seed: 42 # 换一个种子
  sequential: 10
  
  # 训练步数设为 2亿步，平衡任务比较难，多跑一点
  trainer: deprl.custom_trainer.Trainer(steps=int(2e8), epoch_steps=int(2e5), save_steps=int(1e6))

working_dir: ./baselines_Balance