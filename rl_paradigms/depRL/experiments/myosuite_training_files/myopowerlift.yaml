DEP:
  bias_rate: 0.002
  buffer_size: 200
  intervention_length: 5
  intervention_proba: 0.001
  kappa: 1169.7
  normalization: independent
  q_norm_selector: l2
  regularization: 32
  s4avg: 2
  sensor_delay: 1
  tau: 40
  test_episode_every: 5
  time_dist: 5
  with_learning: true

env_args: {}

mpo_args:
  hidden_size: 1024
  lr_actor: 5.0e-05
  lr_critic: 8.0e-05
  lr_dual: 0.002

tonic:
  after_training: ''
  
  agent: deprl.custom_agents.dep_factory(3, deprl.custom_mpo_torch.TunedMPO())(replay=deprl.replays.buffers.Buffer(return_steps=3,
    batch_size=256, steps_between_batches=1000, batch_iterations=30, steps_before_batches=1e5))
  
  before_training: ''
  checkpoint: last
  
  # 🔥 [修正] 直接指向 walk_v0 文件中的 PowerliftEnvV0 类
  # 路径格式：包名.文件名:类名
  environment: deprl.environments.Gym('myosuite.envs.myo.myobase:myoPowerlift', scaled_actions=False, reset_type='random')
  
  environment_name: deprl_powerlift_v0
  full_save: 0
  
  # 🔥 [修正] Header 只需要基本的 import，不需要复杂的 path hack
  # 因为上面 environment 字段已经不仅是 Gym ID，而是直接的类路径引用
  header: import deprl, myosuite
  
  name: myoPowerlift_run
  parallel: 100
  resume: 0
  seed: 0
  sequential: 10
  test_environment: null
  
  trainer: deprl.custom_trainer.Trainer(steps=int(1e8), epoch_steps=int(2e5), save_steps=int(2e6))

working_dir: ./baselines_Powerlift